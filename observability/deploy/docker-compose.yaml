services:
  db:
    image: mysql:8.4.0
    env_file:
      - ./envs/db.env
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password="$$(cat $$MYSQL_PASSWORD_FILE)"
      start_period: 5s
      interval: 3s
      timeout: 5s
      retries: 8
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../sqldb/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    secrets:
      - db_password_file_secret
      - db_root_password_file_secret

  app:
    build:
      args:
        - PYTHON_VERSION=3.12
      context: ./webserver
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - ./envs/app.env
    ports:
      - 5000:80
    secrets:
      - db_password_file_secret

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_started
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml
      # necessary to collect metrics from containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # for docker permission on non-root container (get the group id from `getent group docker`)
    group_add:
      - 984
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - 1777:1777 # pprof extension
      # - 8888:8888 # Prometheus metrics exposed by the Collector
      # - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      # - 4317:4317 # OTLP gRPC receiver
      # - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension

  prometheus:
    image: prom/prometheus:v3.10.0
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "-q", "http://localhost:9090/api/v1/status/runtimeinfo"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s 
    ports:
      - 9090:9090
    volumes:
      - ./observability/prometheus/config.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  jaeger:
    image: jaegertracing/jaeger:2.15.1
    command: ['--config', '/jaeger/config.yaml']
    volumes:
      - ./observability/jaeger/config.yaml:/jaeger/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "-q", "http://localhost:13133/health/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - 16686:16686 # serve frontend
      # - 4317:4317 # accept OpenTelemetry Protocol (OTLP) over gRPC
      # - 4318:4318 # accept OpenTelemetry Protocol (OTLP) over HTTP
      # - 14250:14250
      # - 14268:14268
      - 13134:13133 # endpoint: /status	 | function: Healthcheck port via the healthcheckv2 extension
      # - 8888:8888 # endpoint: /metrics | function: metrics port for exposing metrics which can be scraped with Prometheus compatible systems
      # - 9411:9411

  loki:
    image: grafana/loki:3.6.7
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    # # There is no shell, must be manually installed
    # healthcheck:
    #   test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 1m
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki

  grafana:
    image: grafana/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s --fail http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s 
    ports:
      - 3000:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

secrets:
  db_password_file_secret:
    file: ./secrets/db_password.secret
  db_root_password_file_secret:
    file: ./secrets/db_root_password.secret